<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Golds 4 Souls - Energy" />
  <meta name="theme-color" content="#020204" />
  <title>Golds 4 Souls</title>

  <!-- Mark JavaScript as available before CSS paints the page. -->
  <script>
    document.documentElement.classList.replace('no-js', 'js');
  </script>

  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="landing" id="landing">
    <!--
      These are real <img> elements instead of CSS background-image URLs on purpose.
      The browser discovers them immediately, and script.js waits for them to decode
      before it starts the opening sequence.
    -->
    <div class="scene" aria-hidden="true">
      <img
        class="scene-image bg-one"
        src="assets/bt-1.webp"
        alt=""
        loading="eager"
        decoding="async"
        fetchpriority="high"
      />
      <img
        class="scene-image bg-two"
        src="assets/bt-2.webp"
        alt=""
        loading="eager"
        decoding="async"
      />
      <img
        class="scene-image bg-final"
        src="assets/crown.webp"
        alt=""
        loading="eager"
        decoding="async"
      />
    </div>

    <div class="vignette" aria-hidden="true"></div>

    <nav class="pillar pillar-left" aria-label="Main menu">
      <button
        class="pillar-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="menu-main"
      >
        Menu
      </button>

      <div class="dropdown" id="menu-main">
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="projects.html">Projects</a>
        <a href="music.html">Music</a>
      </div>
    </nav>

    <nav class="pillar pillar-right" aria-label="Explore menu">
      <button
        class="pillar-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="menu-explore"
      >
        Explore
      </button>

      <div class="dropdown" id="menu-explore">
        <a href="blog.html">Blog</a>
        <a href="shakes.html">Shakes</a>
        <a href="events.html">Events</a>
        <a href="members.html">Members</a>
      </div>
    </nav>

    <section class="hero-text" aria-label="Energy">
      <h1>E N E R G Y</h1>
    </section>
  </main>
</body>
</html>
